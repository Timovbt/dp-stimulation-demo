[stimulation.screen]
id = 1
resolution = [1920, 1080]
background_color = [ 0, 0, 0,]
refresh_rate_hz = 60
full_screen = false

[stimulation.stimuli]
color = "white"       #can be 'str' or other formats used by PsychoPy
size = [500,500]      #specified in pixels (stimuli centered around 0.0)

[stimulation.timing]
n_flashes = 500
flash_duration = 30
interval = [500,750] #specify ISI (Tmin,Tmax)

[speller.stt]
enabled = false
width_dva = 2.2
height_dva = 2.2
colors = [ "black", "white",]


[stimulation.controls]
continue = [ "c",]
quit = [ "q", "escape",]

[stimulation.methods]
method = "VEP"

[streams]
marker_stream_name = 'stimulation_marker_stream'
decoder_stream_name = 'decoder-stream'
start_eval_marker = 0
stim_marker = 1
